packages:
  - 'apps/*'
  - 'packages/*'

sharedWorkspaceLockfile: true
engineStrict: true
packageManagerStrictVersion: true

# Native build steps already used by the existing application toolchains.
allowBuilds:
  '@google/genai': false
  '@livekit/local-inference': false
  esbuild: true
  fsevents: true
  protobufjs: false
